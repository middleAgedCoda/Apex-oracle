services:
  - type: web
    name: apex-oracle
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: apex-oracle-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: apex-oracle-db
    plan: free
